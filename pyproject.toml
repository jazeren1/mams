[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mams"
version = "0.8.1"
description = "Media Archive Management System"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "rich>=13.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML>=6.0", "types-requests>=2.31"]

[project.scripts]
mams = "mams.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: exercises the real TMDb API with a configured TMDB_API_TOKEN; excluded from the default run (see docs/INGEST-WORKFLOW.md). Run explicitly with `pytest -m live`.",
]
